# Aviso de venda por E-MAIL (Brevo) — SOMADO ao Telegram. NADA aqui é segredo:
# BREVO_SENDER_EMAIL = "single sender" verificado na Brevo (conta da loja useaura20@gmail.com).
# EMAIL_TO_DEFAULT = destinatário de TESTE enquanto a dona não informa o e-mail dela
