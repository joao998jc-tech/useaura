EMAIL_TO_DEFAULT = "joao998jc@gmail.com"

# SEGREDO (NUNCA no toml, NUNCA no repo) — plugar via:
#   wrangler secret put FIREBASE_SA_PRIVATE_KEY
# Cole o valor do campo "private_key" do SECRETS/firebase-service-account.json
# (o bloco inteiro -----BEGIN PRIVATE KEY----- ... -----END PRIVATE KEY-----).
# O código aceita tanto quebras de linha reais quanto \n escapado.
#
# AVISO DE VENDA via Telegram (substitui o ntfy, que dava 429 no IP do Cloudflare).
# Plugar OS DOIS secrets abaixo (o aviso só funciona com ambos):
#   wrangler secret put TELEGRAM_BOT_TOKEN
#     Token do bot criado no @BotFather. Sem ele, o aviso fica inerte (o pagamento/
#     baixa NÃO dependem disso). Os chat_ids da dona vivem no cofre Firestore
#     secrets/telegram (SA-only), gravados quando ela conecta pelo modo dona.
#   wrangler secret put TELEGRAM_WEBHOOK_SECRET
#     OBRIGATÓRIO (segurança): qualquer string aleatória (ex.: `openssl rand -hex 16`).
#     O Worker registra o webhook com esse secret_token e valida o header
#     X-Telegram-Bot-Api-Secret-Token em /tg-webhook (fail-closed: sem ele, o webhook
#     rejeita tudo e o /tg-pair recusa parear). Fecha o vetor de injeção de chat_id.
#
# AVISO DE VENDA por E-MAIL (Brevo, free 300/dia) — SOMADO ao Telegram. Plugar a chave:
#   wrangler secret put BREVO_API_KEY
#     Chave "SMTP & API" (v3) da conta Brevo. Sem ela o e-mail fica inerte (o
#     pagamento/baixa NÃO dependem disso). Remetente = BREVO_SENDER_EMAIL (single
#     sender verificado na Brevo). Destinatário definitivo = cofre Firestore
#     secrets/email (a dona informa no modo dona "Avisos por e-mail"); trocar NÃO
#     exige deploy. Enquanto o cofre está vazio, cai no EMAIL_TO_DEFAULT.
